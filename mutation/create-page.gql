# Description: Creates a new page in the online store (e.g., About Us, Contact, Policies)
# Required scopes: write_content, write_online_store_pages
# Documentation: https://shopify.dev/docs/api/admin-graphql/latest/mutations/pageCreate
# Usage: Run with "📂 Shopify: Current File (mutation)" task

mutation CreatePage($input: PageCreateInput!) {
  pageCreate(page: $input) {
    page {
      id
      title
      handle
      body
      bodySummary
      isPublished
      createdAt
      updatedAt
    }
    userErrors {
      field
      message
    }
  }
}
